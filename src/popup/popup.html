<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On the Fly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <h1>On the Fly</h1>
        <p class="build-mode" id="build-mode">Public build · Agent disabled</p>
      </header>

      <section class="status-panel" aria-live="polite">
        <span class="status-label">Status</span>
        <span class="status-value" id="edit-status">Loading…</span>
      </section>

      <button class="toggle-button" id="toggle-button" type="button" disabled>
        Loading…
      </button>

      <footer class="popup-footer">
        <p class="diagnostics" id="diagnostics-line">Loading diagnostics…</p>
        <button class="link-button" id="open-options" type="button">Open settings</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
