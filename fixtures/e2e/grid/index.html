<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E2E grid</title>
    <link rel="stylesheet" href="/_shared.css" />
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Grid</h1>
      <section class="grid" data-testid="grid">
        <article class="card" data-testid="grid-1">One</article>
        <article class="card" data-testid="grid-2">Two</article>
        <article class="card" data-testid="grid-3">Three</article>
        <article class="card" data-testid="grid-4">Four</article>
        <article class="card" data-testid="grid-5">Five</article>
        <article class="card" data-testid="grid-6">Six</article>
      </section>
    </main>
  </body>
</html>
